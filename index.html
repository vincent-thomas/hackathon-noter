<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noter</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 2rem;
         font: 16px system-ui, sans-serif; background: #111; color: #ccc; }
  button { width: 120px; height: 120px; border: 0; border-radius: 50%; font-size: 48px; background: #1f6feb; cursor: pointer; }
  .listening { background: #da3633; animation: pulse 1s infinite; }
  .thinking { opacity: .5; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 24px #da363333; } }
</style>
<button id="mic">🎤</button>
<p id="status">Tap to talk</p>
<script>
  let recorder;
  mic.onclick = async () => {
    if (recorder?.state === "recording") return recorder.stop();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      mic.className = "thinking";
      const res = await fetch("/api/talk", { method: "POST", headers: { "content-type": recorder.mimeType }, body: new Blob(chunks) });
      mic.className = "";
      if (!res.ok) return (status.textContent = await res.text());
      status.textContent = "You said: " + decodeURIComponent(res.headers.get("x-transcript"));
      new Audio(URL.createObjectURL(await res.blob())).play();
    };
    recorder.start();
    mic.className = "listening";
    status.textContent = "Listening… tap to send";
  };
</script>

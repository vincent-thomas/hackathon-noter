services:
  app:
    build: .
    # Bun as PID 1 ignores SIGTERM, so every stop waited out Docker's 10 s timeout.
    init: true
    # Same path as on the host: the sandbox's notes mount goes through the host's Docker daemon.
    working_dir: ${PWD}
    volumes:
      - .:${PWD}
      # Lets the app start sandbox containers. This is root on the host: fine for a local PoC, never for a shared box.
      - /var/run/docker.sock:/var/run/docker.sock
    command: bun --watch server.ts
    ports: ["3000:3000"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?put GEMINI_API_KEY in .env}
      ECHO: ${ECHO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

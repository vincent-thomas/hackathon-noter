services:
  app:
    build: .
    # Bun as PID 1 ignores SIGTERM, so every stop waited out Docker's 10 s timeout.
    init: true
    working_dir: ${PWD}
    volumes:
      - .:${PWD}
    command: bun --watch server.ts
    ports: ["3000:3000"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?put GEMINI_API_KEY in .env}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-localhost}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-http://localhost:3000}
      ECHO: ${ECHO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CONDENSE_API_KEY: ${CONDENSE_API_KEY:-}
